<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redefinir senha — Recepção Hospitalar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header class="header reset-header">
      <img class="brand-logo" src="MEDCORE_Logo_horizontal_azul-semfundo.png" alt="MEDCORE">
      <div class="header-copy">
        <h1>Recepção Hospitalar</h1>
      </div>
    </header>
    <section class="card login-card reset-card">
      <h2>Redefinir senha</h2>
      <form id="resetPasswordForm" class="hidden">
        <label for="newPassword">Nova senha</label>
        <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required>
        <label for="confirmPassword">Confirme a nova senha</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
        <button type="submit" class="primary">Salvar nova senha</button>
      </form>
      <p id="resetMessage" class="form-message" role="status" aria-live="polite"></p>
      <a id="loginLink" class="hidden" href="/">Voltar ao login</a>
    </section>
  </main>
  <script src="reset-password.js"></script>
</body>
</html>
